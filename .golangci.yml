version: "2"

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - unused
    - gosec
    - revive
    - unconvert
    - unparam
  exclusions:
    rules:
      # --body-file reads a path the user passed on the CLI by design; no
      # elevated-privilege boundary is being crossed.
      - path: cmd/tether/cmd_send\.go
        linters:
          - gosec
        text: "G304"
      # lock.go and logging.go only open/read paths the daemon derives from
      # its own socket/log path, never from untrusted input.
      - path: internal/daemon/lock\.go
        linters:
          - gosec
        text: "G304"
      - path: internal/daemon/logging(_test)?\.go
        linters:
          - gosec
        text: "G304"
      # autostart.go re-execs os.Executable() (this same binary) and reads/
      # writes only its own derived ~/.tether/daemon.log path, never
      # untrusted input.
      - path: cmd/tether/autostart(_test)?\.go
        linters:
          - gosec
        text: "G204|G304"
      # setIdentity's workspace parameter happens to be "storefront" at
      # every current call site, but it is a general-purpose test helper --
      # a future test naming a different workspace is the point of keeping it.
      - path: cmd/tether/helper_test\.go
        linters:
          - unparam
        text: "setIdentity"
      # wsname execs the fixed "git" binary with args built from a resolved
      # local path, never untrusted input.
      - path: internal/wsname/wsname(_test)?\.go
        linters:
          - gosec
        text: "G204"
